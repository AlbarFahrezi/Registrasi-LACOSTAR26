<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Formulir Registrasi LACOSTAR 26</title>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--royal:#26408F;--paper:#FBFBFF;--ink:#14193F;--mut:#5A6288;--ln:#C2CBF0;--stub:#E9ECF8;--ac:#F2B72B;--acd:#A87A0B;--err:#C4281C;--hi:#D6DDF5}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#000;color:var(--ink);font:16px/1.5 Figtree,system-ui,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:26px 16px 48px}
.logo{display:block;width:clamp(120px,34vw,170px);height:auto;margin:0 auto 12px}
.hero{text-align:center;margin-bottom:22px}
.hero h1{margin:0;font:900 clamp(32px,9.5vw,48px)/1 "Big Shoulders Display","Arial Narrow",Impact,sans-serif;color:#fff;letter-spacing:.01em}
.hero h1 span{display:block}
.hero p{margin:10px auto 0;color:var(--hi);font-size:15px;max-width:40ch}
.hero p+p{margin-top:2px;font-size:14px}
.ticket{display:grid;grid-template-columns:1fr 190px}
.main,.stub{-webkit-mask-image:radial-gradient(circle 14px at var(--a),#0000 13px,#000 14px),radial-gradient(circle 14px at var(--b),#0000 13px,#000 14px);mask-image:radial-gradient(circle 14px at var(--a),#0000 13px,#000 14px),radial-gradient(circle 14px at var(--b),#0000 13px,#000 14px);-webkit-mask-composite:source-in;mask-composite:intersect}
.main{--a:100% 0;--b:100% 100%;background:var(--paper);border-radius:20px 0 0 20px;padding:28px 28px 30px}
.stub{--a:0 0;--b:0 100%;background:var(--stub);border-left:2px dashed var(--ln);border-radius:0 20px 20px 0;padding:22px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;min-height:230px}
.sl{font-size:14px;font-weight:600;color:var(--mut)}
.sn{font:900 96px/1 "Big Shoulders Display",Impact,sans-serif;color:var(--royal);letter-spacing:.01em}
.sn[data-s="b"]{font-size:80px}.sn[data-s="c"]{font-size:56px}.sn[data-s="d"]{font-size:40px}
.sn.empty{color:#B7C0EA}
.ss{font-size:13px;font-weight:700;word-break:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:1.4em}
@keyframes pop{from{transform:scale(1.14)}to{transform:scale(1)}}
.sn.pop{animation:pop .14s ease-out}
.f{margin-bottom:24px}
.f label{display:block;font-weight:600;font-size:15px}
.req{color:var(--err)}
.in{width:100%;border:0;border-bottom:2px solid var(--ink);border-radius:0;padding:8px 0 6px;font:500 21px/1.3 Figtree,system-ui,sans-serif;color:var(--ink);background:transparent}
.in:focus{outline:0;border-bottom-color:var(--royal);box-shadow:0 2px 0 var(--royal)}
.in::placeholder{color:#9AA3C7;text-transform:none}
#sekolah{text-transform:uppercase}
.em{display:none;color:var(--err);font-size:14px;margin:6px 0 0}
.f.bad .in{border-bottom-color:var(--err)}.f.bad .em{display:block}
.msg{color:var(--err);font-size:14px;margin:0 0 14px}
.btn{font:700 17px Figtree,system-ui,sans-serif;background:var(--ac);color:var(--ink);border:0;border-radius:999px;padding:13px 30px;cursor:pointer;box-shadow:0 4px 0 var(--acd);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--acd)}
.btn[disabled]{opacity:.65;cursor:wait}
.note{display:inline-block;text-align:center;font:700 17px Figtree,system-ui,sans-serif;background:var(--ac);color:var(--ink);border-radius:999px;padding:13px 30px;box-shadow:0 4px 0 var(--acd);cursor:default;user-select:none;pointer-events:none}
.btn:focus-visible{outline:3px solid var(--royal);outline-offset:3px}
.ok{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:10px 0}
.ok h2{margin:8px 0 0;font:900 44px/1 "Big Shoulders Display",Impact,sans-serif;color:var(--royal)}
.ok p{margin:0 0 18px;color:var(--mut)}
@media (min-width:1000px){
  .wrap{max-width:1180px;min-height:100vh;display:grid;grid-template-columns:clamp(300px,36vw,480px) minmax(0,1fr);gap:clamp(32px,4vw,56px);align-items:center;padding:32px}
  .logo{width:100%;margin:0}
  .hero{text-align:left;margin-bottom:26px}
  .hero h1{font-size:clamp(40px,4vw,56px)}
  .hero p{margin-left:0;font-size:16px}
  .hero p+p{font-size:14px}
}
@media (max-width:600px){
  .ticket{grid-template-columns:1fr}
  .main{--a:0 100%;--b:100% 100%;border-radius:20px 20px 0 0;padding:22px 20px 24px}
  .stub{--a:0 0;--b:100% 0;border-left:0;border-top:2px dashed var(--ln);border-radius:0 0 20px 20px;display:grid;grid-template-columns:1fr auto;grid-template-areas:"sl sn" "ss sn";column-gap:14px;row-gap:2px;align-items:center;text-align:left;min-height:0;padding:14px 22px}
  .sl{grid-area:sl;align-self:end}
  .ss{grid-area:ss;align-self:start;text-align:left}
  .sn{grid-area:sn;font-size:64px}
  .sn[data-s="b"]{font-size:52px}.sn[data-s="c"]{font-size:40px}.sn[data-s="d"]{font-size:30px}
  .btn,.note{width:100%}
}
@media (prefers-reduced-motion:reduce){.sn.pop{animation:none}.btn{transition:none}}
</style>
</head>

  <div class="col">
    <div class="hero">
      <h1><span>FORMULIR REGISTRASI</span><span>UCL LACOSTAR'26:</span></h1>
      <p>Isi nama sekolah dengan huruf KAPITAL, dan no urut dengan angka.</p>
      <p><span style="color:var(--ac)">*</span> Wajib diisi</p>
    </div>
    <div id="app"></div>
  </div>
</div>
<script>
// URL Web App dari Google Apps Script:
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw2UPJ1Arq1vvyOw8PIQ4deVryc-EK-YFIyEgeCMz1svyauzl_IssvmSyGzf1EYOFGmgg/exec";

const app=document.getElementById('app');
let done=false,sending=false,msg='',vals={sekolah:'',nourut:''},err={sekolah:false,nourut:false},last=null;
const E=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sz=n=>n<=3?'a':n===4?'b':n<=6?'c':'d';

function stub(v){
  const n=v.nourut;
  return `<aside class="stub"><div class="sl">No urut</div><div class="sn${n?'':' empty'}" id="sn" data-s="${sz(n.length)}">${n?E(n):'00'}</div><div class="ss" id="ss">${E(v.sekolah)}</div></aside>`;
}
function view(){
  if(done)return `<div class="ticket"><div class="main"><div class="ok">
    <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="22" fill="#26408F"/><path d="M12 23l7 7 13-14" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h2>Jadwal UCL terkirim</h2><p>Terima kasih. Request diterima.</p>
    <div class="note">Info selanjutnya,dari LO😉</div></div></div>${stub(last)}</div>`;
  return `<div class="ticket"><div class="main">
    <div class="f${err.sekolah?' bad':''}"><label for="sekolah">Nama sekolah <span class="req">*</span></label><input class="in" id="sekolah" autocomplete="off" placeholder="Contoh:SMKN 1 SUBANG" value="${E(vals.sekolah)}"><p class="em">Pertanyaan ini wajib diisi.</p></div>
    <div class="f${err.nourut?' bad':''}"><label for="nourut">No urut <span class="req">*</span></label><input class="in" id="nourut" inputmode="numeric" autocomplete="off" placeholder="Contoh:01" value="${E(vals.nourut)}"><p class="em">Isi dengan angka.</p></div>
    ${msg?`<p class="msg">${E(msg)}</p>`:''}<button class="btn" id="send"${sending?' disabled':''}>${sending?'Mengirim…':'Kirim Request'}</button>
  </div>${stub(vals)}</div>`;
}
function render(){app.innerHTML=view()}

app.addEventListener('input',e=>{
  const t=e.target;if(t.id!=='sekolah'&&t.id!=='nourut')return;
  if(t.id==='nourut')t.value=t.value.replace(/\D/g,'');
  else{const p=t.selectionStart;t.value=t.value.toUpperCase();t.setSelectionRange(p,p)}
  vals[t.id]=t.value;
  if(err[t.id]&&t.value.trim()){err[t.id]=false;t.closest('.f').classList.remove('bad')}
  const sn=document.getElementById('sn');
  document.getElementById('ss').textContent=vals.sekolah;
  if(t.id==='nourut'){
    sn.textContent=vals.nourut||'00';sn.classList.toggle('empty',!vals.nourut);
    sn.dataset.s=sz(vals.nourut.length);
    sn.classList.remove('pop');void sn.offsetWidth;sn.classList.add('pop');
  }
});
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='sekolah'||e.target.id==='nourut')){e.preventDefault();send()}});
app.addEventListener('click',e=>{
  if(e.target.id==='again'){done=false;msg='';vals={sekolah:'',nourut:''};render()}
  if(e.target.id==='send')send();
});

async function send(){
  if(sending)return;
  const sekolah=vals.sekolah.trim().toUpperCase(),nourut=vals.nourut.trim();
  err.sekolah=!sekolah;err.nourut=!/^\d+$/.test(nourut);
  if(err.sekolah||err.nourut){render();const f=document.querySelector('.f.bad .in');if(f)f.focus();return}
  if(!SCRIPT_URL){msg='Alamat penerima belum diatur. Hubungi admin.';render();return}
  sending=true;msg='';render();
  try{
    await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({sekolah,nourut})});
    last={sekolah,nourut};done=true;vals={sekolah:'',nourut:''};
  }catch(e){msg='Jawaban belum terkirim. Periksa koneksi internet, lalu coba lagi.'}
  sending=false;render();scrollTo(0,0);
}
render();
</script>
